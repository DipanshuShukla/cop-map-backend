spring:
    application:
        name: cop-map-config-service
    profiles:
        active: native
    cloud:
        config:
            server:
                native:
                    search-locations: ${CONFIG_SERVER_DIR:classpath:/sample-configs/}
server:
    port: 8888

eureka:
    client:
        register-with-eureka: true
        fetch-registry: true
        service-url:
            defaultZone: ${EUREKA_SERVER_URI:}
    instance:
        instance-id: ${spring.application.name}:${random.value}

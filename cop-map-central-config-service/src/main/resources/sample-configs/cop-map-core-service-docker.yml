server:
  port: 8282

spring:
  datasource:
    url: jdbc:postgresql://copmap-postgres:5432/copmap_db
    username: copmap_user
    password: copmap_password
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: copmap-redis
      port: 6379
      password: ""
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  cache:
    type: redis
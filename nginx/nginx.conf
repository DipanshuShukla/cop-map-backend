events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Route everything to the Spring Cloud Gateway
        location / {
            proxy_pass http://gateway-service:8080;

            # Standard Proxy Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ------------------------------------------------
            # CRITICAL FOR WEBSOCKETS (Location Service)
            # ------------------------------------------------
            # These headers allow Nginx to pass the WebSocket
            # upgrade handshake through to the Gateway
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Prevent Nginx from closing idle WebSocket connections too quickly
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}